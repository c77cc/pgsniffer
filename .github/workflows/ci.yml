name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.11
          cache: true
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.txt ./...
      - name: Build
        run: mkdir -p dist && go build -trimpath -o dist/pgsniffer-linux-amd64 ./cmd/pgsniffer
      - name: Upload Linux binary
        uses: actions/upload-artifact@v6
        with:
          name: pgsniffer-linux-amd64
          path: dist/pgsniffer-linux-amd64
          if-no-files-found: error

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["12", "16", "18"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.11
          cache: true
      - name: Install capture dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev libcap2-bin tcpdump
      - name: Docker end-to-end tests
        env:
          PGSNIFFER_POSTGRES_IMAGE: postgres:${{ matrix.postgres }}-alpine
          PGSNIFFER_E2E_REQUIRED: "1"
          PGSNIFFER_E2E_SETCAP: "1"
          PGSNIFFER_E2E_ARTIFACTS: .artifacts/e2e/postgres-${{ matrix.postgres }}
        run: go test -tags=e2e ./tests/e2e -run TestDockerEndToEnd -v -count=1
      - name: Upload failed E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-postgres-${{ matrix.postgres }}
          path: .artifacts/e2e/postgres-${{ matrix.postgres }}
          if-no-files-found: ignore
